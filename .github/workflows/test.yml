on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: Run tests
      run: |
        make test-junit

    - name: Run CLI to see how it's going to look like
      run: ./tests/scripts/test-cli.sh

    - name: Upload test results
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: junit-results
        path: reports/junit.xml

    - name: Annotate failed tests
      if: always() # Run with test/lint failures.
      uses: granodigital/report-annotate@30cd0bcfa0d7dd43be9becb5fbd9820566b203cf # v3.3.3
      with:
        reports: |
          junit|reports/junit.xml
