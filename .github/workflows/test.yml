on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

    - name: Set up Go
      uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest

    - name: Run tests
      run: |
        make test-junit

    - name: Run CLI to see how it's going to look like
      run: ./tests/scripts/test-cli.sh

    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: junit-results
        path: reports/junit.xml

    - name: Annotate failed tests
      if: always() # Run with test/lint failures.
      uses: granodigital/report-annotate@5a6cb440ac7575bcb535f3ddf5c8793e8c3eda23 # v1.0.1
      with:
        reports: |
          junit|reports/junit.xml
